# Development environment for q2-periodontitis.
#
# The supported runtime is the official QIIME 2 amplicon 2024.10
# distribution (the same one used in CI):
#
#   wget https://data.qiime2.org/distro/amplicon/qiime2-amplicon-2024.10-py310-linux-conda.yml
#   conda env create -n q2-periodontitis --file qiime2-amplicon-2024.10-py310-linux-conda.yml
#   conda env update -n q2-periodontitis --file environment.yml
#   conda activate q2-periodontitis
#   pip install -e .
#
# This file lists the plugin's own requirements; every package below is
# already part of the official amplicon distribution, so the update step
# only verifies them (and adds the test/build tooling).
name: q2-periodontitis
channels:
  - https://packages.qiime2.org/qiime2/2024.10/amplicon/released/
  - conda-forge
  - bioconda
dependencies:
  - python=3.10
  - qiime2
  - q2-types
  - q2cli
  - numpy
  - pandas
  - scipy
  - biom-format
  - jinja2
  - pytest
  - pip
