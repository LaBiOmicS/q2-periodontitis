name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.10"
          channels: conda-forge,bioconda
          auto-activate-base: true

      - name: Install QIIME 2 and Dependencies
        run: |
          conda install -y -c https://packages.qiime2.org/qiime2/2024.10/amplicon/released/ -c conda-forge -c bioconda qiime2 q2-types q2cli biom-format pandas numpy scipy pytest mock typeguard

      - name: Install q2-periodontitis
        run: |
          pip install -e .

      - name: Run Pytest
        run: |
          pytest --verbose
