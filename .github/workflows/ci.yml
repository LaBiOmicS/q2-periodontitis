name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest mock biom-format pandas numpy scipy typeguard

      - name: Install q2-periodontitis
        run: |
          pip install -e .

      - name: Run Tests with Pytest
        run: |
          pytest --verbose
